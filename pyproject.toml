[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chubby-checker"
version = "0.1.0"
description = "Ascent Buildings shipper vs final drawings verification tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11.0",
  "PyMuPDF>=1.24.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "rich>=13.7.0",
  "click>=8.1.0",
  "python-dotenv>=1.0.0",
  "reportlab>=4.0.0",
]

[project.scripts]
chubby-checker = "chubby_checker.cli:main"

[tool.setuptools.packages.find]
include = ["chubby_checker*"]
